<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position</title>
</head>
<body style="padding-bottom: 1000px; padding-left: 82px;">
  <div style="
    background-color: black;
    color: white;
    height: 50px;
    ">Header</div>

  <div style="
  background-color: green;
  color: white;
  position: fixed;
  left: 0;
  bottom: 0;
  top: 50px;
  width: 70px;
  ">side bar
    <div style="position: absolute;
      background-color: red;
      color: white;
      top: 0;
      right: 0;
    ">
      x
    </div>
  </div>

  <div style="
    background-color: lightblue;
    width: 200px;
    height: 200px;
    ">Div 1</div>
  <div style="
    background-color: lightgreen;
    width: 200px;
    height: 200px;
    position: relative;
    ">Div 2
      <div style="position: absolute;
      background-color: rgba(0, 0, 0, 0.384);
      color: white;
      bottom: 10px;
      right: 6px;
    ">
      14:00
    </div>
  </div>

</body>
</html>

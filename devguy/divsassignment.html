<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    p{
      font-family: Roboto, Arial, Helvetica, sans-serif;
      margin: 0;
      font-size: 14px;
    }
    .name{
      font-weight: bold;
      vertical-align: top;
      margin-bottom: 5px;
    }
    .cat{
      color: grey;
      margin-bottom: 5px;
    }
    .trend{
      color: grey;
      font-size: 12px;
    }
    .channel-picture{
      display: inline-block;

    }
    .pfp{
      width:60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    .tweet-preview{
      display: inline-block;
      margin-right: 80px;
    }
    .name{

    }
    .cat-tweet{
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button{
    background-color: rgb(2, 158, 255);
    border: none;
    border-width: 1px;
    border-radius: 4px;
    color:white;
    font-weight: bold;
    cursor: pointer ;
    transition: box-shadow 0.15s, padding 0.15s;
    padding:7px 12px 7px 12px;
  }

  .button:hover{
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
  }

  .button:active{
    padding: 8px;
  }
  </style>
</head>
<body>
  <div class="cat-tweet">
  <div class="channel-picture">
    <img class="pfp" src="cats/download.jpeg" alt="">
  </div>
  <div class="tweet-preview">
    <p class="name">oliver</p>
    <p class="cat">the.cat</p>
    <p class="trend">Popular</p>
  </div>
  <div class="follow">
    <button>Follow</button>
  </div>
  </div>

</body>
</html>

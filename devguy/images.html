<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Document</title>
  <style>
    input{
      display: block;
      margin-bottom: 5px;
      outline: none;
    }
    p{
      width: 220px;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 20px;
      display: inline-block;
      vertical-align: middle;
      margin-bottom: 20px;
    }

    .google{
      box-sizing: content-box;
      width: 300px;
      margin-bottom: 30px;
      font-size: 12px;
      padding: 17px;
      padding-right: 120px;
      border: none;
      border-radius: 19px;
      box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.15);
      outline: none;
    }
    .logo{
      width: 100px;

    }
    .cont{
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .firstName{
      display: inline-block;
      padding:8px 4px 10px 4px;
      width: 120px;
      border: 1px solid grey;
      border-radius: 5px;
    }
    .email{
      display: block;
      padding:8px 4px 10px 4px;
      width: 255px;
      border: 1px solid grey;
      border-radius: 5px;
      margin-bottom: 12px;
    }
    .sign-up{
      display: block;
      background-color: rgba(16, 16, 190, 0.842);
      color: white;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      padding:13px 4px 13px 4px;
      width: 264px;
      border: none;
      border-radius: 5px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .sign-up:hover{
      opacity: 0.7;
    }
    .ride{
      font-size: 28px;
      width: 550px;
    }
    .pickup{
      display: block;
      background-color: rgb(233, 231, 231);
      color: rgba(255, 255, 255, 0.418);
      font-family: Arial, Helvetica, sans-serif;
      padding:15px 4px 15px 14px;
      width: 400px;
      border: none;
      margin-bottom: 10px; 
    }
    .request{
      display: inline-block;
      background-color: rgb(0, 0, 0);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding:13px 5px 13px 5px;
      width: 120px;
      border: none;
      margin-top: 20px;
      margin-bottom: 12px;
      margin-right: 20px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .request:hover{
      opacity: 0.7;
    }

    .schedule{
      display: inline-block;
      background-color: rgb(233, 231, 231);      
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      padding:13px 5px 13px 5px;
      width: 150px;
      border: none;
      margin-bottom: 12px;
      cursor: pointer;
        transition: opacity 0.15s;
    }
    .schedule:hover{
      opacity: 0.7;
    }
  </style>
  </head>

  <input type="text" placeholder="Name">
  <input type="text" placeholder="Email">
  <p>
    Thanks for chatting with our customer support. Would you like to take our quick survey?
  </p>
  <button>Yes</button>
  <button>No</button>
  <br>
  <div class="cont">
      <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google">
      <input class="google" type="text" placeholder="Search Google or type a URL">
  </div>

  <div class="linkedin3">
    <input class="firstName" type="text" placeholder="First Name">
    <input class="firstName" type="text" placeholder="Last Name">
    <input class="email" type="text" placeholder="Email">
    <button class="sign-up">Sign Up</button>
  </div>
  <div class="bolt">
    <p class="ride">Request a ride now</p>
    <input class="pickup" type="text" placeholder="Enter pickup location">
    <input class="pickup" type="text" placeholder="Enter destination">
    <button class="request">Request now</button>
    <button class="schedule">Schedule for later</button>
  </div>

</body>
</html>

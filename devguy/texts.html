<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p, button {font-family: Arial, Helvetica, sans-serif;}
    img{width: 150px;}

    .tweet{
      display:flex;
      width: 400px;
      align-items: center;
      border-radius: 4px;
      gap: 10px;
      padding: 10px;
      box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.15);
    }
    .cat-tweet{
      width: 40px;
      height: 40px;
      border-radius: 30px;
    }
    .happening{
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      width: 280px;
    }
    .tweet-button{
    background-color: rgb(2, 158, 255);
    border: none;
    border-width: 1px;
    border-radius: 18px;
    color:white;
    font-weight: bold;
    cursor: pointer ;
    transition: box-shadow 0.15s, padding 0.15s;
    padding:7px 12px 7px 12px;
  }

  .tweet-button:hover{
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
  }

  .tweet-button:active{
    padding: 8px;
  }


  .ayi{
    width: 200px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .ayi-img{
    width: 100%;
    height: 150px;
    object-fit: cover;
  }
  .parent{
    display: flex;
    gap: 16px;
  }

  .ayi-txt{
    margin-top: 5px;
    margin-left: 5px;
    margin-bottom: 0;
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    display: inline-block;
  }

  .ayi-text2{
    font-size: 13px;
    margin-top: 5px;
    margin-left: 5px;
    color: #979595;  
   
  }
  .friend{
    margin-bottom:10px ;
    margin-left:5px ;
    padding: 8px 12px 8px 12px;
    border-radius: 3px;
    color: white;
    background: rgba(49, 62, 255, 0.897);
    border: none;
    cursor: pointer;
  }
  .pfp{
    display: flex;
    align-items: center;
    margin: 5px;
  }
  .profil-pic{
    width: 30px;
    height: 30px;
    border-radius: 50%;
  }
  .context{

  }

  </style>
</head>
<body>
  <div class="parent">
    <div class="ayi">
      <div>
        <img class="ayi-img" src="cats/download (1).jpeg" alt="">
      </div>
      <div class="pfp">
        <img class="profil-pic" src="pfp/channels4_profile.jpg" alt="">
      </div>
      <div class="context">
        <p class="ayi-txt">Ayi</p>
        <p class="ayi-text2">2 mutual friends</p>
        <button class="friend">Add Friend</button>
      </div>

  </div>
  <br>
  <div class="ayi">
    <img class="ayi-img" src="cats/download (2).jpeg" alt="">
    <p class="ayi-txt">Khalid</p>
    <p class="ayi-text2">2 mutual friends</p>
    <button class="friend">Add Friend</button>
  </div>
  <div class="ayi">
    <img class="ayi-img" src="cats/download.jpeg" alt="">
    <p class="ayi-txt">Patience</p>
    <p class="ayi-text2">1 mutual friend</p>
    <button class="friend">Add Friend</button>
  </div>
  </div>
  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .cancel{
      position: absolute;
      background-color: black;
      color: white;
      top: -5px;
      left: -4px;
      padding: 5px 10px 5px 10px;
      border-radius: 10px;
    }
    .box{
      background-color: grey;
      height: 180px;
      width: 320px;
      position: fixed;
      bottom: 0;
      right: 0;
    }
    .time{
      position: absolute;
      background-color: black;
      color: white;
      bottom: 0;
      right: 5px;
      padding: 2px 4px 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body style="padding-bottom: 3000px;">
  <div class="box">
    <div class="cancel">
      x
    </div>
    <div class="time">0:29</div>
  </div>
</body>
</html>
